name: Refresh DevOps Dashboard

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Build dashboard
        env:
          # Org 1 (required)
          SF_INSTANCE_URL:  ${{ secrets.SF_INSTANCE_URL }}
          SF_CLIENT_ID:     ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_ORG1_LABEL:    ${{ secrets.SF_ORG1_LABEL }}   # optional display name, e.g. "Trailsignup"
          # Org 2 (optional — add secrets to enable second tab)
          SF2_INSTANCE_URL: ${{ secrets.SF2_INSTANCE_URL }}
          SF2_CLIENT_ID:    ${{ secrets.SF2_CLIENT_ID }}
          SF2_CLIENT_SECRET: ${{ secrets.SF2_CLIENT_SECRET }}
          SF_ORG2_LABEL:    ${{ secrets.SF_ORG2_LABEL }}   # optional display name, e.g. "Production"
          # GitHub + Slack
          GH_TOKEN:         ${{ secrets.GH_PAT }}
          SLACK_WEBHOOK:    ${{ secrets.SLACK_WEBHOOK }}
        run: python scripts/build_dashboard.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "chore: auto-refresh dashboard [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git pull --rebase origin main
          git push
